name: CI

on:
  pull_request:
    branches: [main, staging, prod]
  push:
    branches: [main, staging, prod]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      composer-cache-hit: ${{ steps.composer-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_mysql, tokenizer, fileinfo, openssl, curl, redis, xdebug, gd
          coverage: xdebug
      # The two audit steps run here, BEFORE anything is installed: every other
      # job needs this one, so a lock the advisory database flags is refused
      # before a dependency's install scripts can execute in any job. setup-php
      # exports COMPOSER_NO_AUDIT=1 (it silences the audit inside require /
      # update / remove, not the explicit command) and recommends exactly this.
      # Node 24 / npm 11 is the pin the test job uses for the same lock file.
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Dependency audit - composer (questionnaire sec 15b, OQ-1-186) - gating
        # A high, critical or UNRATED advisory in composer.lock (dev packages
        # included) fails the step; low and medium are listed as ignored and
        # never gate. The exit status is the whole verdict - the summary format
        # counts ignored advisories too, so no output line is parsed. Abandoned
        # packages print and never gate. An advisory source that refuses the
        # connection or answers with an error fails the step
        # (--ignore-unreachable is deliberately absent). No bypass: a high
        # advisory with no fix is ONE ruled ignore entry with a reason and a
        # remove-when clause.
        run: composer audit --locked --abandoned=report --ignore-severity=low --ignore-severity=medium
      - name: Dependency audit - npm (questionnaire sec 15b, OQ-1-186) - gating
        # Every dependency, the dev toolchain included; high and critical gate,
        # moderate and below print. Reads package-lock.json alone - nothing is
        # installed yet.
        run: npm audit --audit-level=high
      - name: Cache Composer
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4' }
      - run: composer install --no-interaction --prefer-dist
      - name: Generate OpenAPI spec (guarded on a path annotation - VP2-5 R12, s218)
        # app/ carries #[OA\Info] + #[OA\Server] but no PATH annotation (#[OA\Get] etc.),
        # so generation fails ("Required @OA\PathItem() not found") - and since the
        # scaffold (s037) the `|| echo` fallback masked that failure on EVERY run (the
        # Rule-13 report-only class). Now: generate only when a path annotation exists,
        # and then a failure FAILS the job; otherwise print the true reason and skip.
        # The first annotation increment (Decision 17, master-action #86) makes it live.
        # The guard lives in scripts/generate-openapi-if-annotated.sh (pattern self-tested
        # at startup - a dead matcher exits 2, never the skip branch). Controls (s218): a
        # planted #[OA\Get] without responses made generate run and fail locally
        # ("requires at least one @OA\Response()"; a RED commit on the PR branch repeats
        # it on CI); the guard is silent on Info/Server alone; a doctored pattern exits 2.
        run: sh scripts/generate-openapi-if-annotated.sh

  test:
    needs: setup
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: lesily_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
      - run: cp .env.github .env
      - run: composer install --no-interaction --prefer-dist
      # puppeteer@25 requires Node >=22.12 — pin it rather than trusting the
      # runner default (code-reviewer I1, s135); caches cut the per-job
      # Chromium re-download (M3). Node 24 (LTS) bundles npm 11, matching the
      # npm major that wrote package-lock.json — npm 10 rejects the lock's
      # optional @emnapi/* entries with EUSAGE (CI rounds 1-2, s135).
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - name: Cache puppeteer browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('package-lock.json') }}
      - name: Install Node deps (puppeteer — Browsershot receipt rendering, UC-1-121)
        run: npm ci
      - name: npm audit signatures (questionnaire sec 15b registry security, VP2-5 R11) - gating
        # Verifies every installed package's registry signature and provenance
        # attestation against the registry's published keys (npm/cli
        # lib/utils/verify-signatures.js: an invalid or missing signature sets
        # exitCode 1; no installed dependencies -> "found no installed dependencies
        # to audit", exit 1 - the step cannot pass vacuously). Needs node_modules,
        # so it follows npm ci here rather than the setup job's lock-only audits.
        # name/version come from the installed tree, integrity + signatures from the
        # registry manifest (pacote) and are checked against the registry's TUF-published
        # keys - a locally tampered integrity is npm ci's EINTEGRITY, not this step's.
        # Baseline s218: 86 packages verified, 33 attestations. Controls (s218): no
        # node_modules -> exit 1; a registry serving the signature but not its key
        # (registry.npmmirror.com) -> EMISSINGSIGNATUREKEY, exit 1.
        run: npm audit signatures
      # Round-5 fix: npm ci installs the puppeteer PACKAGE but the browser
      # binaries' postinstall download is nondeterministic on runners — the
      # suite failed with "Could not find chrome-headless-shell". Explicit,
      # idempotent install into ~/.cache/puppeteer (cache-step-backed).
      # One browser per invocation — the CLI silently drops extra browser args
      # (round-6 log: chrome installed, chrome-headless-shell never did).
      - name: Install puppeteer browsers (chrome + headless shell)
        run: |
          npx puppeteer browsers install chrome
          npx puppeteer browsers install chrome-headless-shell
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - name: Run tests with coverage
        run: php artisan test -p --coverage --coverage-clover=coverage.xml --coverage-crap4j=crap4j.xml --log-junit=junit.xml
      # The single source of both reports. The sonarcloud job downloads these
      # instead of re-running the suite — see the long note on that job for why,
      # and for the absolute-path coupling this introduces.
      - name: Share coverage + test reports with sonarcloud
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.xml
            junit.xml
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
      - name: CRAP radar (report-only — R-053 verdict, radar not gate)
        run: php scripts/crap-radar.php crap4j.xml 30
      - uses: actions/upload-artifact@v7
        with:
          name: crap4j-report
          path: crap4j.xml

  quality:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      # Default (shallow) checkout: the only history user here was the diff-scoped
      # sec 2.14 gate (PR #99), whole-tree since OQ-1-170.
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4' }
      - run: composer install --no-interaction --prefer-dist
      - name: Pint (lint)
        run: vendor/bin/pint --test
      - name: Larastan (static analysis)
        run: vendor/bin/phpstan analyse --memory-limit=512M
      - name: Semgrep SAST (native image - VP2-5 R10, s218)
        # The archived returntocorp/semgrep-action@v1 ("This project is deprecated ...
        # migrate to native Semgrep") pinned semgrep 1.36.0, which Semgrep no longer
        # supports (< 1.76.0). Same rule packs; `--error` makes findings fail the step
        # (`semgrep scan` exits 0 on findings without it). The image has no ENTRYPOINT,
        # so `args` is the whole command; the workspace is the working directory.
        # Tag pinned (1.177.0, 2026-09-10) so a bump is a reviewed diff.
        # Control (s218): a planted eval() file made this step refuse (RED commit).
        uses: docker://semgrep/semgrep:1.177.0
        with:
          args: semgrep scan --config p/security-audit --config p/php --error
      - name: Test-class naming (conv-plan sec 2.14, OQ-1-170) - gating
        # Behavior-named test classes only: partition names are banned outright;
        # artifact names (the six production suffixes + seeder / mail-render /
        # command) need the @testclass-carveout: line. Whole tests/ tree - the
        # diff-scoped form silently skipped on an empty diff and could not see
        # the seeder / mail-render names at all (OQ-1-169 F2-F5 sat green under
        # it). Same script as the lefthook test-class-naming hook. Liveness
        # proof: the summary line must exist and the scan must have read a file.
        run: |
          set +e
          sh scripts/check-test-class-naming.sh > "$RUNNER_TEMP/test-class-naming.txt" 2>&1
          status=$?
          summary=$(grep '^Test-class naming check:' "$RUNNER_TEMP/test-class-naming.txt")
          set -e
          cat "$RUNNER_TEMP/test-class-naming.txt"
          [ -n "$summary" ] || { echo "no summary line - the check did not run"; exit 1; }
          scanned=$(echo "$summary" | sed -E 's/.*; ([0-9]+) file\(s\) scanned/\1/')
          [ "$scanned" -gt 0 ] || { echo "scanned nothing"; exit 1; }
          exit $status
      - name: Write-path chain (conv-plan sec 2.15.C, OQ-1-170) - gating
        # Controllers never ::retrieve( / DB:: / ->persist(; DB::transaction only in
        # interactors; reactors never write (ban 4 - side effects only). Whole app/
        # tree, call-form only (leading comment lines excluded);
        # database/ seeders+migrations out of scope. Same script as the lefthook
        # write-path-chain hook. Liveness proof: the summary line must exist, the
        # scan must have read a file, and every per-check population (controllers,
        # interactors, reactors) must be non-zero - a renamed layer directory would
        # otherwise leave that check scanning nothing while the step stays green.
        run: |
          set +e
          sh scripts/check-write-path-chain.sh > "$RUNNER_TEMP/write-path.txt" 2>&1
          status=$?
          summary=$(grep '^Write-path chain check:' "$RUNNER_TEMP/write-path.txt")
          set -e
          cat "$RUNNER_TEMP/write-path.txt"
          [ -n "$summary" ] || { echo "no summary line - the check did not run"; exit 1; }
          scanned=$(echo "$summary" | sed -E 's/.*; ([0-9]+) file\(s\) scanned.*/\1/')
          [ "$scanned" -gt 0 ] || { echo "scanned nothing"; exit 1; }
          for layer in controllers interactors reactors; do
            population=$(echo "$summary" | sed -E "s/.*[( ]$layer ([0-9]+)[,)].*/\1/")
            [ "$population" -gt 0 ] || { echo "$layer population is $population - that check scanned nothing"; exit 1; }
          done
          exit $status
      - name: Command validation placement (amendment AQ, OQ-1-172) - gating
        # Amendment AQ: validateAndCreate only at the HTTP boundary, ::from() internally,
        # internal-only commands carry no rules(). Gating since OQ-1-172 T7 - the legacy
        # internal validateAndCreate sites (design sec 6.1.1 table B) were cleared by
        # T4-T6. Liveness proof: the summary line must exist and check 1 must have
        # inspected at least one command - a script that never ran, died before its
        # summary, or scanned nothing fails this step. A skipped (unresolvable) command
        # is a bypassed check, not a pass, so skips fail too. The script's own exit status
        # carries the same verdict (a violation, a skipped class, an empty check 1), so
        # the lefthook hook enforces these floors as well; the final exit-status read is
        # the belt for a fail path that does not surface in the counted summary.
        run: |
          set +e
          sh scripts/check-command-validation-placement.sh > "$RUNNER_TEMP/aq-placement.txt" 2>&1
          status=$?
          summary=$(grep '^AQ placement check:' "$RUNNER_TEMP/aq-placement.txt")
          set -e
          cat "$RUNNER_TEMP/aq-placement.txt"
          [ -n "$summary" ] || { echo "no summary line - the check did not run"; exit 1; }
          violations=$(echo "$summary" | sed -E 's/^AQ placement check: ([0-9]+) violation.*/\1/')
          checked=$(echo "$summary" | sed -E 's/.*; ([0-9]+) controller-referenced.*/\1/')
          skipped=$(echo "$summary" | sed -E 's/.*; ([0-9]+) skipped.*/\1/')
          [ "$checked" -ge 1 ]
          [ "$violations" -eq 0 ]
          [ "$skipped" -eq 0 ]
          [ "$status" -eq 0 ]
      - name: Database test-trait placement (OQ-1-181, sec 2.1) - gating
        # The DB trait lives in tests/TestCase.php only; a per-class re-declaration
        # (alone, combined, or a leftover import) silently shadows the base class's
        # migrateDatabases() override - the Infection schema-reuse seam. Liveness
        # proof: the summary line must exist and the scan must have read a file.
        run: |
          set +e
          sh scripts/check-db-trait-placement.sh > "$RUNNER_TEMP/db-trait.txt" 2>&1
          status=$?
          summary=$(grep '^DB trait placement check:' "$RUNNER_TEMP/db-trait.txt")
          set -e
          cat "$RUNNER_TEMP/db-trait.txt"
          [ -n "$summary" ] || { echo "no summary line - the check did not run"; exit 1; }
          scanned=$(echo "$summary" | sed -E 's/.*; ([0-9]+) file\(s\) scanned/\1/')
          [ "$scanned" -gt 0 ] || { echo "scanned nothing"; exit 1; }
          exit $status
      - name: Status assertions + production constants (conv-plan sec 2.2 Rule 11, OQ-1-177 / OQ-1-183) - gating
        # A test states its expected HTTP status itself: assertStatus( fed by
        # ->status() (the tautology - the expectation moves with the mutation)
        # or by a bare integer (use the named assert), a `$x = ...->status()`
        # parked value, or the enum on the expected side of assertSame, is
        # refused over the whole tests/ tree. Same script as the lefthook hook; every
        # matcher and the comment filter self-test at startup (a dead matcher
        # aborts with no summary). Liveness proof: the summary line must exist
        # and BOTH populations must be non-zero - tests/ (M1-M4) and, since
        # OQ-1-183, app/ (A1 a bare setStatusCode( int, A2 a bare status-map
        # arm); a missing field fails closed (sed -n ... p prints nothing).
        run: |
          set +e
          sh scripts/check-status-assertions.sh > "$RUNNER_TEMP/status-assertions.txt" 2>&1
          status=$?
          summary=$(grep '^Status-assertion check:' "$RUNNER_TEMP/status-assertions.txt")
          set -e
          cat "$RUNNER_TEMP/status-assertions.txt"
          [ -n "$summary" ] || { echo "no summary line - the check did not run"; exit 1; }
          tests_scanned=$(echo "$summary" | sed -nE 's/.*tests: ([0-9]+) file\(s\) scanned.*/\1/p')
          app_scanned=$(echo "$summary" | sed -nE 's/.*app: ([0-9]+) file\(s\) scanned.*/\1/p')
          [ -n "$tests_scanned" ] && [ "$tests_scanned" -gt 0 ] || { echo "scanned nothing (tests)"; exit 1; }
          [ -n "$app_scanned" ] && [ "$app_scanned" -gt 0 ] || { echo "scanned nothing (app)"; exit 1; }
          exit $status
      - name: Mutation kill-verdict classifier self-test (OQ-1-167)
        # The kill-integrity gate's steady state is always-PASS, so a rotted
        # classifier would be invisible on every clean infection.json. This
        # exercises it against known false-kill + genuine-kill shapes so a
        # regression that neuters the detection fails CI here (no DB needed).
        run: php scripts/check-mutation-kills.php --self-test

  mutation-test:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: '', MYSQL_ALLOW_EMPTY_PASSWORD: 'yes', MYSQL_DATABASE: lesily_test }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        # pcov: recommended Infection initial-coverage driver — 2-5x faster than
        # Xdebug, no kill-verdict accuracy loss (verdicts come from test re-runs,
        # not the driver; amendment H keeps CI authoritative). R-053 finding 3.4.
        with:
          php-version: '8.4'
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist
      # puppeteer@25 requires Node >=22.12 — pin it rather than trusting the
      # runner default (code-reviewer I1, s135); caches cut the per-job
      # Chromium re-download (M3). Node 24 (LTS) bundles npm 11, matching the
      # npm major that wrote package-lock.json — npm 10 rejects the lock's
      # optional @emnapi/* entries with EUSAGE (CI rounds 1-2, s135).
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - name: Cache puppeteer browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('package-lock.json') }}
      - name: Install Node deps (puppeteer — Browsershot receipt rendering, UC-1-121)
        run: npm ci
      # Round-5 fix: npm ci installs the puppeteer PACKAGE but the browser
      # binaries' postinstall download is nondeterministic on runners — the
      # suite failed with "Could not find chrome-headless-shell". Explicit,
      # idempotent install into ~/.cache/puppeteer (cache-step-backed).
      # One browser per invocation — the CLI silently drops extra browser args
      # (round-6 log: chrome installed, chrome-headless-shell never did).
      - name: Install puppeteer browsers (chrome + headless shell)
        run: |
          npx puppeteer browsers install chrome
          npx puppeteer browsers install chrome-headless-shell
      - run: cp .env.github .env
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - name: Infection (changed lines only)
        # Native line-level diff scope (R-053 finding 3.1): --git-diff-lines mutates
        # ONLY added/modified lines — strictly narrower than the old hand-rolled file
        # filter; the full run (mutation.yml) is the latent-escape safety net
        # for everything outside the diff (/tdd-red amendment Q). --logger-github
        # annotates escaped mutants inline in the PR diff.
        # NOTE: --map-source-class-to-test deliberately NOT used — our behavior-named
        # test classes (conv-plan §2.14) don't follow the Foo→FooTest mapping it
        # assumes, so it would silently drop coverage in the initial run.
        # Guards kept: no changed app/ files → skip (empty scope exits 1 even with
        # passing tests; master-action #99); empty suite → skip (initial PHPUnit run
        # exits 1 with "No tests executed!" — session 055 edge; excludes abstract
        # *TestCase.php bases per conv-plan §2.10 from the count).
        # Third vacuous-run guard: --ignore-msi-with-no-mutations (PR #113 edge —
        # a diff of PHPDoc + cast DELETIONS generated 0 mutants, and Infection
        # reports an empty mutation set as MSI 0%, tripping --min-msi vacuously).
        # The 80/85 gates still enforce whenever ≥1 mutant exists, and Infection
        # errors/aborts still fail. Deliberately CLI-only, NOT infection.json5 —
        # the mutation.yml full run must NEVER inherit it: 0 mutants across all
        # of app/ is the s135 catastrophic-abort signal and must stay loud.
        # --threads=1 kept deliberately: the diff-scoped run is tiny (~24
        # mutants), not worth the token-DB setup. Un-tokenised threads>1 would
        # race (OQ-1-167 mechanism C: TEST_TOKEN without LARAVEL_PARALLEL_TESTING
        # never switches DB, and colliding RefreshDatabase migrations are
        # mis-counted as kills); the full run solves that with per-thread token
        # DBs instead (mutation.yml, OQ-1-173).
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'app/*.php')
          if [ -z "$CHANGED" ]; then
            echo "No PHP files changed under app/ — skipping Infection."
            exit 0
          fi
          TEST_COUNT=$(find tests -name '*Test.php' ! -name '*TestCase.php' 2>/dev/null | wc -l)
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "No *Test.php files (excluding abstract *TestCase.php bases) found in tests/ — skipping Infection."
            exit 0
          fi
          vendor/bin/infection --git-diff-lines --git-diff-base=origin/${{ github.base_ref }} --logger-github --threads=1 --min-msi=80 --min-covered-msi=85 --ignore-msi-with-no-mutations
      - name: Assert every mutation kill was earned by an assertion (OQ-1-167)
        # Backstop for the kill-verdict topology above: fail if any recorded
        # "kill" carries positive evidence it was a DB-race SQLSTATE error or a
        # masked surviving mutant rather than an assertion failure. Skips cleanly
        # when Infection was skipped (no infection.json). Replaces the R-12 rule.
        # Runs unless the job was cancelled (OQ-1-173 F8) — a red Infection step
        # is exactly when the verdict audit matters most.
        if: ${{ !cancelled() }}
        run: php scripts/check-mutation-kills.php infection.json

  sonarcloud:
    needs: test
    # Skip on Dependabot PRs: SONAR_TOKEN is not exposed to Dependabot PR runs by default
    # (GitHub policy since Sept 2021 — must be added to "Dependabot secrets" separately).
    # Without the token, scan fails with "Project not found". Master-action #101 (lesily-api side).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 is REQUIRED and must stay: SonarCloud attributes new-code
      # lines by blame, and a shallow clone silently degrades that attribution.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # Reports come from the `test` job rather than a second full suite run.
      #
      # This job used to re-run the entire suite — its own MySQL service, xdebug,
      # Node, npm ci, both puppeteer browsers, migrate — duplicating the `test`
      # job it already `needs:`. No rationale for the duplication was ever
      # recorded, and the two commands DRIFTED: `test` ran --log-junit while this
      # one did not, so `sonar.php.tests.reportPath=junit.xml` was never
      # satisfied and every scan logged "nothing will be imported from this
      # report" — SonarCloud has had ZERO test-execution data since day one.
      #
      # Both reference codebases already do it this way (§8 Rule #15): LeaveDates
      # `.gitlab-ci.yml` passes coverage-report.clover + test-report.xml between
      # stages via artifacts:/dependencies:, and subscription-platform pairs
      # --coverage-clover with --log-junit in ONE command, then hands both to its
      # sonarcloud job via upload/download-artifact. lesily-api was the outlier.
      #
      # COUPLING, do not break: clover and junit both record ABSOLUTE paths, so
      # this works only while `test` and `sonarcloud` check out to the same runner
      # workspace. Never add a custom `path:` to either checkout.
      - uses: actions/download-artifact@v8
        with:
          name: coverage-reports
      - uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  openapi-diff:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4' }
      - run: composer install --no-interaction --prefer-dist
      - name: Generate base spec
        # Same guard as the build job (VP2-5 R12, s218), copied to /tmp first because the
        # base tree predates the script; a generation failure fails the job; `|| true` is gone.
        run: |
          cp scripts/generate-openapi-if-annotated.sh /tmp/generate-openapi-if-annotated.sh
          git checkout origin/${{ github.base_ref }}
          sh /tmp/generate-openapi-if-annotated.sh
          if [ -f storage/api-docs/api-docs.json ]; then cp storage/api-docs/api-docs.json /tmp/base-spec.json; else echo "{}" > /tmp/base-spec.json; fi
      - name: Generate PR spec
        run: |
          git checkout ${{ github.sha }}
          sh scripts/generate-openapi-if-annotated.sh
          if [ -f storage/api-docs/api-docs.json ]; then cp storage/api-docs/api-docs.json /tmp/pr-spec.json; else echo "{}" > /tmp/pr-spec.json; fi
      - name: Diff specs
        # Skip diff if both specs are empty stubs (pre-chunk-1). Re-enabled implicitly when real specs land.
        # Tufin/oasdiff-action is the canonical single-action variant; oasdiff/oasdiff-action@main
        # fails because the root has no action.yml (only sub-actions). Master-action #98.
        if: hashFiles('/tmp/base-spec.json') != '' && hashFiles('/tmp/pr-spec.json') != ''
        uses: Tufin/oasdiff-action@v2.1.3
        continue-on-error: true
        with:
          base: /tmp/base-spec.json
          revision: /tmp/pr-spec.json
          check-breaking: true
          fail-on-diff: true
