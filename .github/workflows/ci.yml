name: CI

on:
  pull_request:
    branches: [main, staging, prod]
  push:
    branches: [main, staging, prod]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      composer-cache-hit: ${{ steps.composer-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_mysql, tokenizer, fileinfo, openssl, curl, redis, xdebug, gd
          coverage: xdebug
      - name: Cache Composer
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4' }
      - run: composer install --no-interaction --prefer-dist
      - name: Generate OpenAPI spec
        # Tolerate "Required @OA\PathItem() not found" pre-chunk-1 (no routes annotated yet).
        # UC-1-097 (Health Check) is Tier-1 #1 in chunk-1 Coding Order; first @OA\Get lands then.
        # Master-action-list #86 spec-hygiene gate will re-tighten this step at chunk-1 build.
        run: php artisan l5-swagger:generate || echo "OpenAPI spec generation skipped — no routes annotated yet (expected pre-chunk-1)."

  test:
    needs: setup
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: lesily_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
      - run: cp .env.github .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - name: Run tests with coverage
        run: php artisan test -p --coverage --coverage-clover=coverage.xml --log-junit=junit.xml
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  quality:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4' }
      - run: composer install --no-interaction --prefer-dist
      - name: Pint (lint)
        run: vendor/bin/pint --test
      - name: Larastan (static analysis)
        run: vendor/bin/phpstan analyse --memory-limit=512M
      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with: { config: 'p/security-audit p/php' }

  mutation-test:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: '', MYSQL_ALLOW_EMPTY_PASSWORD: 'yes', MYSQL_DATABASE: lesily_test }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.github .env
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - name: Infection (changed files only)
        # Short-circuit when no app/ PHP files changed (e.g., yml-only PR): empty
        # --filter causes Infection to exit 1 even with passing tests. Master-action #99.
        # Also short-circuit when the test suite is empty: Infection's initial PHPUnit
        # run exits 1 with "No tests executed!" on an empty suite, which Infection treats
        # as failure. Edge case hit during chunk-1 Phase 1 redo (session 055): all
        # 5 Tier-1 UC tests reverted simultaneously, leaving tests/Feature/ empty
        # before redo TDD-RED restarts. Excludes abstract *TestCase.php bases per
        # coding-conventions-plan.md §2.10 (FoundationTestCase, etc.) from the test count.
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'app/*.php' | tr '\n' ',')
          if [ -z "$CHANGED" ]; then
            echo "No PHP files changed under app/ — skipping Infection."
            exit 0
          fi
          TEST_COUNT=$(find tests -name '*Test.php' ! -name '*TestCase.php' 2>/dev/null | wc -l)
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "No *Test.php files (excluding abstract *TestCase.php bases) found in tests/ — skipping Infection."
            exit 0
          fi
          vendor/bin/infection --filter="$CHANGED" --threads=4 --min-msi=80 --min-covered-msi=85

  sonarcloud:
    needs: test
    # Skip on Dependabot PRs: SONAR_TOKEN is not exposed to Dependabot PR runs by default
    # (GitHub policy since Sept 2021 — must be added to "Dependabot secrets" separately).
    # Without the token, scan fails with "Project not found". Master-action #101 (lesily-api side).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: '', MYSQL_ALLOW_EMPTY_PASSWORD: 'yes', MYSQL_DATABASE: lesily_test }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', coverage: xdebug }
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.github .env
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - run: php artisan test -p --coverage-clover=coverage.xml
      - uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  openapi-diff:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4' }
      - run: composer install --no-interaction --prefer-dist
      - name: Generate base spec
        # Tolerate empty spec pre-chunk-1 (see build job comment).
        run: |
          git checkout origin/${{ github.base_ref }}
          php artisan l5-swagger:generate || true
          if [ -f storage/api-docs/api-docs.json ]; then cp storage/api-docs/api-docs.json /tmp/base-spec.json; else echo "{}" > /tmp/base-spec.json; fi
      - name: Generate PR spec
        run: |
          git checkout ${{ github.sha }}
          php artisan l5-swagger:generate || true
          if [ -f storage/api-docs/api-docs.json ]; then cp storage/api-docs/api-docs.json /tmp/pr-spec.json; else echo "{}" > /tmp/pr-spec.json; fi
      - name: Diff specs
        # Skip diff if both specs are empty stubs (pre-chunk-1). Re-enabled implicitly when real specs land.
        # Tufin/oasdiff-action is the canonical single-action variant; oasdiff/oasdiff-action@main
        # fails because the root has no action.yml (only sub-actions). Master-action #98.
        if: hashFiles('/tmp/base-spec.json') != '' && hashFiles('/tmp/pr-spec.json') != ''
        uses: Tufin/oasdiff-action@v2.1.3
        continue-on-error: true
        with:
          base: /tmp/base-spec.json
          revision: /tmp/pr-spec.json
          check-breaking: true
          fail-on-diff: true
