name: Mutation

on:
  push:
    branches: [main]
    # Full code surface (OQ-1-173): every merge that can move the mutant set or
    # its verdicts gets a full-run read; docs-only merges never burn a run.
    paths:
      - 'app/**'
      - 'tests/**'
      - 'database/**'
      - 'routes/**'
      - 'config/**'
      - 'composer.lock'
      - 'infection.json5'
      - 'phpunit.xml'
      - 'scripts/**'
      - '.github/workflows/mutation.yml'
  schedule:
    # Weekly backstop (Sat 20:30 UTC = 02:00 SLT Sunday): catches environment
    # drift (runner image / PHP patch bumps) that no merge would trigger.
    - cron: '30 20 * * 6'
  workflow_dispatch:

jobs:
  mutation-full:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: '', MYSQL_ALLOW_EMPTY_PASSWORD: 'yes', MYSQL_DATABASE: lesily_test }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        # pcov: recommended Infection initial-coverage driver — 2-5x faster than
        # Xdebug, no kill-verdict accuracy loss (verdicts come from test re-runs,
        # not the driver). R-053 finding 3.4.
        with: { php-version: '8.4', coverage: pcov }
      - run: composer install --no-interaction --prefer-dist
      # puppeteer block mirrors ci.yml test job (s135 5-layer onboarding): the
      # suite includes Browsershot receipt tests (UC-1-121) — without these steps
      # Infection's initial run fails. The old report-only `|| true` masked exactly
      # that failure nightly since s135 while the job reported success (R-053, s144).
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - name: Cache puppeteer browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('package-lock.json') }}
      - name: Install Node deps (puppeteer — Browsershot receipt rendering, UC-1-121)
        run: npm ci
      - name: Install puppeteer browsers (chrome + headless shell)
        run: |
          npx puppeteer browsers install chrome
          npx puppeteer browsers install chrome-headless-shell
      - run: cp .env.github .env
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - name: Full mutation run (gated — minMsi/minCoveredMsi from infection.json5)
        # The full run is the latent-escape detector for diff-scoped PR runs
        # (/tdd-red amendment Q; R-053 finding 3.2) — it MUST fail loudly, never
        # `|| true` (Rule #13: that masked a total failure while reporting green).
        # --threads=4 with LARAVEL_PARALLEL_TESTING=1 (OQ-1-173): Infection labels
        # each worker with TEST_TOKEN, but Laravel switches to the per-token
        # lesily_test_test_<N> databases only when LARAVEL_PARALLEL_TESTING is
        # also set (ParallelTesting::inParallel). Without it every thread migrates
        # the ONE lesily_test and the DDL races are counted as kills (OQ-1-167
        # mechanism C) — if that topology ever silently returns, the kill-verdict
        # step below REDs the run. The initial coverage run carries no TEST_TOKEN
        # and stays on the lesily_test migrated above. Measured at --threads=1:
        # 3h21m–3h32m per full run (four runs, s190–s195); threads=4 targets ~1h.
        # The per-PR diff-scoped job stays --threads=1 (ci.yml — tiny scope).
        env:
          LARAVEL_PARALLEL_TESTING: 1
        run: vendor/bin/infection --threads=4
      - name: Assert every mutation kill was earned by an assertion (OQ-1-167)
        # Backstop for the kill-verdict topology above: fail if any recorded
        # "kill" carries positive evidence it was a DB-race SQLSTATE error or a
        # masked surviving mutant rather than an assertion failure. Replaces the
        # R-12 interim rule (classify kill mechanisms by hand). Runs even when
        # the mutation gate fails (if: always()) — a failing run is exactly when
        # the verdict audit matters most; the script exits 0 on a missing report,
        # so this step cannot invent a failure.
        if: always()
        run: php scripts/check-mutation-kills.php infection.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: infection-report
          path: |
            infection.html
            infection.json
            infection.log
            infection-summary.log
