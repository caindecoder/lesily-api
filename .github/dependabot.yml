version: 2
# cooldown: Dependabot proposes only versions published at least 7 days ago -
# questionnaire 15b's one-week cooling, automatic for direct versions. GitHub
# exempts security updates; transitive lock entries a PR pulls in are still
# checked at review (npm install --before). Coding conventions 4.9.
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "composer"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "npm"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "github-actions"]
