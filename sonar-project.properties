# SonarCloud config — per coding-conventions-plan.md Decision 6
# Quality gates: >=80% new-code coverage, <=3% new-code duplication, A rating
sonar.projectKey=caindecoder_lesily-api
sonar.organization=caindecoder
sonar.host.url=https://sonarcloud.io
sonar.qualitygate.wait=true

sonar.sources=app
sonar.tests=tests
sonar.exclusions=**/vendor/**,**/storage/**,**/bootstrap/cache/**,**/database/migrations/**,**/public/**

sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=junit.xml

sonar.sourceEncoding=UTF-8
