# Lesily chunk-1 role → permission grant matrix
# Source: Documentation/06-design/chunk-1/_process/2026-05-24-rbac-permissions-matrix.md
# Chunk-1 scope: minimal grants sufficient for Tier-1 + Tier-2 UCs.
# Manager: empty grants (chunk-1 placeholder per cd-roles-permissions §3 Notes).
# Platform Super Admin: bypasses RBAC at the evaluator level (no row grants needed).

platform_super_admin: []

owner:
  - users.invite
  - users.view
  - users.change-role
  - users.revoke-invitation
  - users.remove
  - companies.view
  - companies.update
  - billing.view
  - billing.manage
  - audit.view
  # Owner-only per the matrix §Module-8 (UC-1-028 — every other tenant role ❌).
  - ownership-transfer.request
  # Transfer reads (UC-1-125/126) — owner + admin + auditor per the matrix
  # §Module-8 view rows (hr/payroll/employee/manager ❌).
  - ownership-transfer.view-status
  - ownership-transfer.view-history
  # Owner-only per the matrix §Module-8 (UC-1-114 + UC-1-115 — the requester's
  # own authority; the designated target explicitly cannot withdraw).
  - ownership-transfer.withdraw

admin:
  - users.invite
  - users.view
  - users.change-role
  - users.revoke-invitation
  - users.remove
  - companies.view
  - companies.update
  - billing.view
  - audit.view
  - ownership-transfer.view-status
  - ownership-transfer.view-history

hr_officer:
  - users.invite
  - users.view
  - users.revoke-invitation
  - companies.view

# payroll_officer: NO users.view — the matrix (§Module-3 users.view row) denies it;
# the roster is the company-membership list, not the payroll-facing employee
# directory (chunk-2). Seed↔matrix divergence resolved 2026-07-03 (UC-1-017 lap 3).
# NO billing.view either — the matrix (§Module-6 billing.view row) marks payroll ❌;
# the payroll pay-run surface is chunk-5, not the billing read family. Seed↔matrix
# divergence resolved 2026-07-12 (slice-plans-billing T1, F2/D-A).
payroll_officer:
  - companies.view

auditor:
  - users.view
  - companies.view
  - billing.view
  - audit.view
  - ownership-transfer.view-status
  - ownership-transfer.view-history

employee:
  - companies.view

manager: []
