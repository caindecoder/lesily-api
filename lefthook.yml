pre-commit:
  parallel: true
  commands:
    pint:
      glob: "*.php"
      # Use vendor/bin/pint.bat directly (Composer's Windows wrapper) for Herd/git-bash compatibility.
      # Bare `php` or `./vendor/bin/pint` shell script doesn't work because Herd ships `php.bat`
      # (not `php.exe`) and git-bash's sh doesn't auto-resolve .bat extensions.
      # The .bat wrapper internally calls Herd's PHP via Windows PATH.
      run: vendor/bin/pint.bat --dirty {staged_files}
      stage_fixed: true
    test-class-naming:
      glob: "tests/**/*Test.php"
      # Sec 2.14 (coding-conventions-plan): behavior-named test classes only.
      # Logic lives in scripts/check-test-class-naming.sh (shared with the CI
      # quality job); pure-POSIX sh - immune to the Herd php.bat gotcha above
      # AND to lefthook's {brace} templating (which mangles inline shell groups).
      run: sh scripts/check-test-class-naming.sh {staged_files}
